name: asm GEMM in emulator (gfx950)
on:
  workflow_dispatch:
    inputs:
      tests:
        description: "pytest targets"
        required: false
        default: "test/device/amd/test_asm_gemm.py"
permissions:
  contents: read
jobs:
  asmgemm:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DEV: MOCKKFD+AMD::gfx950
      PYTHONPATH: .
      ROCM_PATH: /opt/rocm
    steps:
      - uses: actions/checkout@v6
      - name: Setup Environment
        uses: ./.github/actions/setup-tinygrad
        with:
          key: amd-minimal
          deps: testing_unit
          amd: 'true'
          llvm: 'true'
      - name: Install hipcc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends hipcc hip-dev rocm-llvm rocm-device-libs rocm-core
          echo "/opt/rocm/bin" >> $GITHUB_PATH
      - name: hipcc version
        run: hipcc --version
      - name: Instrument emulator (CI only, not committed)
        run: |
          sed -i 's/^  lds_size = ((rsrc2 \(.*\)$/  lds_size = ((rsrc2 \1\n  print(f"[emudbg] name={name} rsrc2={rsrc2:#x} lds_size={lds_size} grid=({gx},{gy},{gz}) local=({lx},{ly},{lz}) scratch={scratch_size}", flush=True)/' test/mockgpu/amd/emu.py
          grep -n "emudbg" test/mockgpu/amd/emu.py
      - name: Run asm GEMM tests in the emulator
        shell: bash
        run: |
          set +e
          for t in TestAsmGEMM::test_tiny TestHkBf16AtbGemm::test_single; do
            echo "=== $t" >> pytest.log
            DEBUG=5 timeout 1500 python -X faulthandler -m pytest -s -x test/device/amd/test_asm_gemm.py::$t 2>&1 | grep -e emudbg -e "exec gid" -e "Fatal Python" -e "emu.py" -e passed -e failed -e Error > full.txt
            rc=${PIPESTATUS[0]}
            grep emudbg full.txt | tail -n 4 >> pytest.log
            grep -v emudbg full.txt | tail -n 30 >> pytest.log
            echo "=== $t exit $rc" >> pytest.log
          done
          cat pytest.log | grep emudbg | sort | uniq -c | head
          grep -q 'exit 0' pytest.log
      - name: Summary
        if: always()
        shell: bash
        run: |
          for t in test_tiny test_single; do
            msg=$(awk "/=== .*::$t\$/,/=== .*::$t exit/" pytest.log | grep -v '^\s*$' | tail -n 45 | cut -c1-220 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=$t::$msg"
          done
