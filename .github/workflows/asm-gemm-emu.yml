name: asm GEMM in emulator (gfx950)
on:
  workflow_dispatch:
    inputs:
      tests:
        description: "pytest targets"
        required: false
        default: "test/device/amd/test_asm_gemm.py"
permissions:
  contents: read
jobs:
  asmgemm:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DEV: MOCKKFD+AMD::gfx950
      PYTHONPATH: .
      ROCM_PATH: /opt/rocm
    steps:
      - uses: actions/checkout@v6
      - name: Setup Environment
        uses: ./.github/actions/setup-tinygrad
        with:
          key: amd-minimal
          deps: testing_unit
          amd: 'true'
          llvm: 'true'
      - name: Install hipcc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends hipcc hip-dev rocm-llvm rocm-device-libs rocm-core
          echo "/opt/rocm/bin" >> $GITHUB_PATH
      - name: hipcc version
        run: hipcc --version
      - name: Run asm GEMM tests in the emulator
        shell: bash
        run: |
          set +e
          for t in TestAsmGEMM::test_tiny TestAsmGEMM::test_verify_with_numpy TestHkBf16AtbGemm::test_single; do
            echo "=== $t" >> pytest.log
            timeout 1500 python -X faulthandler -m pytest -v -rs -x test/device/amd/test_asm_gemm.py::$t >> pytest.log 2>&1
            echo "=== $t exit $?" >> pytest.log
          done
          grep -q 'exit 0' pytest.log
      - name: Summary
        if: always()
        shell: bash
        run: |
          for t in test_tiny test_verify_with_numpy test_single; do
            msg=$(awk "/=== .*::$t\$/,/=== .*::$t exit/" pytest.log | grep -v '^\s*$' | tail -45 | cut -c1-220 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=$t::$msg"
          done
