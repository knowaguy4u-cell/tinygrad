name: cdna4 full emulator suite
on:
  workflow_dispatch:
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        backend: [amd, amdllvm]
        arch: [gfx950]
    name: diag (${{ matrix.backend }} ${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DEV: MOCKKFD+AMD:${{ matrix.backend == 'amdllvm' && 'LLVM' || '' }}:${{ matrix.arch }}
      SKIP_SLOW_TEST: 1
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-tinygrad
        with:
          key: ${{ matrix.backend }}-minimal
          deps: testing_unit
          amd: 'true'
          llvm: 'true'
      - name: eye
        continue-on-error: true
        shell: bash
        run: |
          echo "ulimit -s: $(ulimit -s)" > eye.txt
          PYTHONFAULTHANDLER=1 python -m pytest -n 1 -v -p no:cacheprovider test/runtime/test_arange.py::TestArange::test_eye_complexity >> eye.txt 2>&1; echo "rc=$?" >> eye.txt
          python -c "import sys,threading; print('reclimit', sys.getrecursionlimit()); import tinygrad; print('reclimit after tinygrad', sys.getrecursionlimit()); print('thread stack', threading.stack_size())" >> eye.txt 2>&1
      - name: summary
        if: always()
        shell: bash
        run: |
          enc() { sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g'; }
          echo "::error title=eye::$(grep -v '^\s*$' eye.txt | cut -c1-220 | head -n 150 | enc)"
