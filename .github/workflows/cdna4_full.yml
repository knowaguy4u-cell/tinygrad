name: cdna4 full emulator suite
on:
  workflow_dispatch:
jobs:
  full:
    strategy:
      fail-fast: false
      matrix:
        backend: [amd, amdllvm]
        arch: [gfx950]
    name: full (${{ matrix.backend }} ${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DEV: MOCKKFD+AMD:${{ matrix.backend == 'amdllvm' && 'LLVM' || '' }}:${{ matrix.arch }}
      SKIP_SLOW_TEST: 1
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-tinygrad
        with:
          key: ${{ matrix.backend }}-minimal
          deps: testing_unit
          amd: 'true'
          llvm: 'true'
      - name: full suite
        continue-on-error: true
        run: python -X faulthandler -m pytest -n=auto test/runtime test/device/amd -q -rfEs -p no:cacheprovider --junitxml=report.xml 2>&1 | tee out.txt; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ matrix.backend }}-${{ matrix.arch }}
          path: |
            report.xml
            out.txt
      - name: summary
        if: always()
        shell: bash
        run: |
          enc() { sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g'; }
          echo "::error title=results::$(grep -E "^(FAILED|ERROR) |[0-9]+ (passed|failed)|worker .* crashed|_ (Test|test)" out.txt | cut -c1-300 | tail -n 40 | enc)"
          echo "::error title=crash::$(grep -n -A45 -E "Fatal Python error|Segmentation|Illegal|replacing crashed worker" out.txt | cut -c1-200 | head -n 120 | enc)"
          echo "::error title=oom::$( (sudo dmesg -T 2>/dev/null | grep -i -E "killed process|out of memory|oom" ; free -m) | cut -c1-200 | tail -n 30 | enc)"
          echo "::error title=asserts::$(grep -n -B3 -A25 "test_simple_unroll_no_between_phi" out.txt | grep -v PASSED | cut -c1-200 | head -n 80 | enc)"
