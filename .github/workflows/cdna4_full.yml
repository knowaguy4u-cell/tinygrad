name: cdna4 full emulator suite
on:
  workflow_dispatch:
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        backend: [amd, amdllvm]
        arch: [gfx950, gfx1100]
    name: diag (${{ matrix.backend }} ${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DEV: MOCKKFD+AMD:${{ matrix.backend == 'amdllvm' && 'LLVM' || '' }}:${{ matrix.arch }}
      SKIP_SLOW_TEST: 1
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-tinygrad
        with:
          key: ${{ matrix.backend }}-minimal
          deps: testing_unit
          amd: 'true'
          llvm: 'true'
      - name: eye
        continue-on-error: true
        shell: bash
        run: |
          /usr/bin/time -v python -X faulthandler -m pytest -v -p no:cacheprovider test/runtime/test_arange.py::TestArange::test_eye_complexity > eye.txt 2>&1; echo "rc=$?" >> eye.txt
          free -m >> eye.txt
      - name: others
        continue-on-error: true
        shell: bash
        run: |
          python -X faulthandler -m pytest -v -p no:cacheprovider --tb=short test/runtime/test_linearizer.py::TestLinearizer::test_simple_unroll_no_between_phi_dependencies test/runtime/test_custom_kernel.py::TestUnshardIndex test/runtime/test_arange.py::TestIndexing > oth.txt 2>&1; echo "rc=$?" >> oth.txt
      - name: summary
        if: always()
        shell: bash
        run: |
          enc() { sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g'; }
          echo "::error title=eye::$(grep -v '^\s*$' eye.txt | cut -c1-220 | tail -n 70 | enc)"
          echo "::error title=others::$(grep -E 'PASSED|FAILED|SKIPPED|ERROR|Error|assert|^E |rc=|Fatal|File ' oth.txt | cut -c1-220 | tail -n 70 | enc)"
